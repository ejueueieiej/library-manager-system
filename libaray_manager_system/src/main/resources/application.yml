# spring 配置
spring:
  # 应用名称
  application:
    name: library_manager_system
    # 数据库配置
  datasource:
    # ${变量名:默认值} —— 冒号后面是本地开发的默认值，不配环境变量也能直接跑
    # 真实部署时用环境变量覆盖，例如：DB_HOST=10.0.0.8  DB_PASSWORD=真实密码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_system}
    username: ${DB_USER:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:60000}
# 文件上传--一个文件最大 10MB
#         整个请求最大 12MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# mybatis 配置
mybatis:
# xml映射配置
  mapper-locations: classpath:mapper/*.xml
#  实体类配置
  type-aliases-package: org.libaray_manager_system.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名法
    map-underscore-to-camel-case: true

# 服务器端口
server:
  port: 8081
