# spring 配置
spring:
  # 应用名称
  application:
    name: library_manager_system
    # 数据库配置
  datasource:
    # ${变量名:默认值} —— 冒号后面是本地开发的默认值，不配环境变量也能直接跑
    # 真实部署时用环境变量覆盖，例如：DB_HOST=10.0.0.8  DB_PASSWORD=真实密码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_system}
    username: ${DB_USER:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:60000}
# 文件上传--一个文件最大 10MB
#         整个请求最大 12MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
#  spring-ai配置
  ai:
    deepseek:
      api-key: ${DEEPSEEK_LIBRARY_KEY:api-key}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        temperature: 0.7
        # 模型最大输出字符数
        max-tokens: 2000
  mvc:
    async:
      # SSE 是异步请求，默认超时可能先于模型返回，必须放大
      request-timeout: 200000
library:
  ai:
    enabled: true
    mock: false                # true = 不调真实模型，返回固定话术（答辩兜底）
    model: ${DEEPSEEK_MODEL:deepseek-flash}   # 只用于展示/落库，与 spring.ai 那个保持同一个 env
    tools-enabled: true        # 模型不支持工具调用时改 false
    max-context-messages: 20   # 最多带多少条历史      max-context-chars: 6000    # 历史总字符预算
    daily-quota: 100           # 每人每天最多问多少次
    stream-timeout-ms: 180000  # 单次流式最长 3 分钟
# mybatis 配置
mybatis:
# xml映射配置
  mapper-locations: classpath:mapper/*.xml
#  实体类配置
  type-aliases-package: org.libaray_manager_system.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名法
    map-underscore-to-camel-case: true

# 服务器端口
server:
  port: 8081
