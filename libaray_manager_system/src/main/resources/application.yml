# spring 配置
spring:
  # 应用名称
  application:
    name: library_manager_system
    # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/library_system
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: 123456

# mybatis 配置
mybatis:
# xml映射配置
  mapper-locations: classpath:mapper/*.xml
#  实体类配置
  type-aliases-package: org.libaray_manager_system.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名法
    map-underscore-to-camel-case: true

# 服务器端口
server:
  port: 8081
