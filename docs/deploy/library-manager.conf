# =============================================================
#  星河图书 · 图书管理系统 —— 独立 server 块（端口 91）
# -------------------------------------------------------------
#  设计原则：不碰你原来 90 端口上的旧项目。
#  用法：这个文件放在 nginx 的 conf 目录下，
#        在 conf\nginx.conf 的 http { } 里加一行 include 即可：
#
#            include  "D:/java/nginx-1.22.0-web/conf/library-manager.conf";
#
#  两个项目的分工：
#      http://localhost:90   -> 你原来的 tlias 项目（原样不动）
#      http://localhost:91   -> 星河图书（本项目）
# =============================================================

server {
    listen       91;
    server_name  localhost;
    charset      utf-8;
    client_max_body_size 10m;

    # ★★ root 必须写在 server 这一层，不能只写在 location / 里！
    #
    #    因为 nginx 的 root 是"从外层往内层继承"的，不会从兄弟 location 继承。
    #    如果把 root 只放在 location / 里，那么：
    #        location = /index.html      ← 继承不到，退回 nginx 默认 root
    #        location ~* \.(js|css)$     ← 同样继承不到
    #    而 nginx 默认 root 是 <nginx安装目录>/html —— 正好是你旧项目的目录，
    #    结果 91 端口会莫名其妙地把旧项目端出来（这个坑我们已经踩过一次了）。
    root  "D:/java/IDEA project/library_manager_system/library-web/dist";
    index index.html index.htm;

    # ---------------- 前端页面 ----------------
    location / {
        # history 路由回退：直接访问或刷新 /books、/login 时交给 index.html 处理
        try_files $uri $uri/ /index.html;
    }

    # ---------------- 后端接口 ----------------
    # 前端请求 /api/books  ->  转发到 http://localhost:8081/books
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://localhost:8081;
    }

    # ---------------- 图书封面图 ----------------
    # 后端上传接口返回 /uploads/2026/10/xxx.jpg 这种相对地址，
    # 浏览器直接请求它（不是 /api 开头），必须单独转发给后端，否则封面全是 404。
    #
    # ⚠️ 必须写 ^~ ：下面有一条静态资源正则 location ~* \.(jpg|png|...)$，
    #    nginx 的匹配顺序是"先找最长前缀，该前缀没标 ^~ 就还要再让正则试一遍，正则优先"。
    #    不加 ^~ 的话 /uploads/xxx.jpg 会被当成前端静态文件去 dist 里找，直接 404。
    location ^~ /uploads/ {
        proxy_pass http://localhost:8081/uploads/;
        proxy_set_header Host $host;
    }

    # =============================================================
    #  前端缓存策略（2.0 新增）
    # =============================================================

    # ① index.html 【绝不缓存】
    #    它是"外壳"，里面引用的是带 hash 的 JS 文件名（如 index-CuCQ5zJc.js）。
    #    重新打包后 JS 文件名会变；如果浏览器还在用旧外壳，
    #    就会去请求一个已经被删掉的旧 JS —— 表现是"代码改了页面却没变"，
    #    控制台只有一个 404，非常难查。
    #    （我们真踩过：2.0 的登录页一直出不来，顶栏还显示 1.0 的"退出登录（2.0 开放）"）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ② 带 hash 的静态资源 【长期缓存】
    #    文件名里带内容指纹，内容一变文件名就跟着变，
    #    所以可以放心让浏览器缓存 30 天，省流量也更快。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
